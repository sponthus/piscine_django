<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My cv</title>
    <style>
        table, th, td {
            border: 4px solid;
            border-style: solid;
            border-collapse: collapse;
            border-color: brown;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Year</th>
            <th>Job title</th>
            <th>Location</th>
        </tr>
        <tr>
            <td>2004</td>
            <td>Chief happiness officer</td>
            <td style="border-bottom-color: #424242;">Everywhere</td>
        </tr>
        <tr>
            <td>2005</td>
            <td style="border-right-color: #424242;">Main director</td>
            <td style="border-color: #424242;">France</td>
        </tr>
    </table>
</body>
</html>
